version: "3.9"

# Aurobox 合併專案 - 一次啟動 LINE 後端 + Dashboard、機器人控制模組，以及各自的資料庫。
#
# 使用前請先：
#   1. 到 line-backend/ 底下，把 .env.example 複製成 .env，填入 LINE 相關金鑰。
#   2. 到 flashbot-robot/ 底下，把 .env.example 複製成 .env，填入 Pudu 相關金鑰。
#   3. 兩份 .env 裡的 DATABASE_URL，主機名稱請分別改成 db-line / db-robot
#      （因為在 docker network 內，不能再用 localhost 連到資料庫）。
#      - line-backend/.env  →  DATABASE_URL=postgresql+psycopg://postgres:postgres@db-line:5432/aurobox_line
#      - flashbot-robot/.env →  DATABASE_URL=postgresql://myuser:mypassword@db-robot:5432/aurobox_db
#        （帳號密碼請對應下方 db-line / db-robot 的 POSTGRES_USER / POSTGRES_PASSWORD 設定）
#   4. ROBOT_API_BASE_URL / CENTRAL_API_BASE_URL 不需要手動改，下面已經用
#      environment 區塊覆寫成 compose 內的服務名稱，取代兩份 .env.example 裡開發用的 ngrok 網址。

services:
  db-line:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aurobox_line
    volumes:
      - db-line-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 對外開放方便本機用 DBeaver/psql 檢查，不需要可移除

  db-robot:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: aurobox_db
    volumes:
      - db-robot-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  line-backend:
    build:
      context: ./line-backend
    restart: unless-stopped
    env_file:
      - ./line-backend/.env
    environment:
      # 覆寫掉 .env 裡開發用的 ngrok 網址，改用 compose network 內的服務名稱直接互連
      ROBOT_API_BASE_URL: http://flashbot-robot:5000
    depends_on:
      - db-line
      - flashbot-robot
    ports:
      - "8000:8000"

  flashbot-robot:
    build:
      context: ./flashbot-robot
    restart: unless-stopped
    env_file:
      - ./flashbot-robot/.env
    environment:
      CENTRAL_API_BASE_URL: http://line-backend:8000
    # 注意：flashbot-robot 原本的 Dockerfile 只 EXPOSE 5000，但 run.py 的 --port 預設值其實是 6000，
    # 兩者原本互相矛盾（見合併文件 docs/ 內的說明）。這裡明確覆寫啟動指令、指定監聽 5000，
    # 讓「文件寫的埠、compose 開的埠、程式實際監聽的埠」三者一致，不用去改動原始程式碼。
    command: ["python", "-u", "run.py", "--host", "0.0.0.0", "--port", "5000"]
    depends_on:
      - db-robot
    ports:
      - "5000:5000"
    volumes:
      # instance/ 存放機器人指令 log（robot_commands.log）與（若未設定 DATABASE_URL 時的）SQLite 備援檔，
      # 掛成 volume 才不會每次重啟容器就消失。
      - flashbot-instance:/app/instance

volumes:
  db-line-data:
  db-robot-data:
  flashbot-instance:
